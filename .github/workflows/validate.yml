name: Validate IPTV catalog
on: [push, pull_request, workflow_dispatch]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_epg.py examples/demo.xml data/epg-map.csv
      - run: python scripts/normalize_m3u.py examples/demo.m3u /tmp/liangyou-demo-normalized.m3u
